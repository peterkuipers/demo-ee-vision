name: extract-pptx

on:
  push:
    paths:
      - "carriers/**/*.pptx"
      - "tools/extract_pptx.py"
      - ".github/workflows/extract-pptx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet python-pptx
      - run: python3 tools/extract_pptx.py
      - name: Commit extracts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carriers/**/extracted/pptx-text.md || true
          if git diff --cached --quiet; then
            echo "no extract changes"
          else
            git commit -m "chore: refresh pptx extracts [skip ci]"
            git push
          fi
